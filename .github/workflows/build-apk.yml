name: Build NEXTLI Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nextli-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies and verify React renderer
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm ls react react-dom @react-three/fiber @react-three/drei three
          npm run typecheck
      - name: Build static web app
        run: npm run build
        env:
          CAPACITOR_BUILD: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Create and sync Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Urnas3D-Nextli.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Urnas3D-Nextli-apk
          path: Urnas3D-Nextli.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: NEXTLI Urnas 3D APK ${{ github.run_number }}
          generate_release_notes: true
          files: Urnas3D-Nextli.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
